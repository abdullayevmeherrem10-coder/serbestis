<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel — Sərbəst İş Platforması</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #1e293b;
            --accent: #d4a853;
            --accent-glow: #f0c75e;
            --accent-dark: #b8922e;
            --surface: rgba(255,255,255,0.03);
            --surface-hover: rgba(255,255,255,0.06);
            --border: rgba(212,168,83,0.15);
            --border-strong: rgba(212,168,83,0.3);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --success: #22c55e;
            --danger: #ef4444;
            --danger-bg: rgba(239,68,68,0.1);
            --radius: 16px;
            --radius-sm: 10px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary);
            color: var(--text);
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: url('background.webp') center/cover no-repeat;
            z-index: 0;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.85);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 30px 20px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .header p { color: var(--text-dim); font-size: 0.85rem; }

        /* Login */
        .login-card {
            max-width: 400px;
            margin: 40px auto;
            background: rgba(15,23,42,0.88);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 36px;
            backdrop-filter: blur(24px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .login-card h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--accent);
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(15,23,42,0.9);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            margin-bottom: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(212,168,83,0.1);
        }

        select option { background: var(--primary); }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent-dark));
            color: var(--primary);
        }

        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(212,168,83,0.3); }

        .btn-danger {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: var(--danger);
        }

        .btn-danger:hover { background: rgba(239,68,68,0.25); }

        .btn-sm { padding: 6px 14px; font-size: 0.75rem; }

        .btn-block { width: 100%; }

        /* Dashboard */
        .dashboard { display: none; }
        .dashboard.active { display: block; }
        .login-card.hidden { display: none; }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(15,23,42,0.8);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(16px);
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card {
            background: rgba(15,23,42,0.85);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(24px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 20px;
            background: rgba(15,23,42,0.8);
            border: 1px solid var(--border-strong);
            border-radius: var(--radius-sm);
            padding: 4px;
            overflow-x: auto;
        }

        .tab {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-dim);
            white-space: nowrap;
            transition: all 0.3s;
            border: none;
            background: transparent;
            font-family: inherit;
        }

        .tab.active {
            background: rgba(212,168,83,0.1);
            color: var(--accent);
        }

        .tab:hover:not(.active) { color: var(--text); }

        /* Table */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            text-align: left;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        th {
            color: var(--text-dim);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.7rem;
            letter-spacing: 0.5px;
        }

        tr:hover td { background: var(--surface-hover); }

        .key-badge {
            font-family: 'Courier New', monospace;
            background: rgba(212,168,83,0.1);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-badge.done {
            background: rgba(34,197,94,0.15);
            color: var(--success);
        }

        .status-badge.pending {
            background: rgba(234,179,8,0.15);
            color: #eab308;
        }

        .status-badge.nokey {
            background: rgba(100,116,139,0.15);
            color: var(--text-dim);
        }

        /* Works overview */
        .work-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.85rem;
        }

        .work-row:last-child { border: none; }

        .work-row .num {
            min-width: 28px;
            height: 28px;
            border-radius: 6px;
            background: rgba(212,168,83,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--accent);
            flex-shrink: 0;
        }

        .work-row.taken .num {
            background: rgba(34,197,94,0.1);
            color: var(--success);
        }

        .work-row .title { flex: 1; }

        .work-row .taker {
            font-size: 0.75rem;
            color: var(--success);
            text-align: right;
            max-width: 200px;
        }

        /* Actions row */
        .actions-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 200;
            animation: toastIn 0.3s ease;
            max-width: 380px;
        }
        .toast.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); color: var(--success); }
        .toast.error { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: var(--danger); }
        @keyframes toastIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

        .spinner { width: 16px; height: 16px; border: 2px solid transparent; border-top-color: currentColor; border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .print-btn {
            background: rgba(59,130,246,0.15);
            border: 1px solid rgba(59,130,246,0.3);
            color: #3b82f6;
        }

        @media print {
            body { background: #fff; color: #000; }
            .header, .tabs, .actions-row, .btn, .login-card, .stats { display: none !important; }
            .card { border: 1px solid #ddd; background: #fff; }
            th, td { color: #000; border-color: #ddd; }
            .key-badge { color: #000; background: #f0f0f0; }
        }

        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            th, td { padding: 8px 10px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>&#9881; Admin Panel</h1>
        <p>Sərbəst İş Seçim Platforması — İdarəetmə</p>
    </div>

    <!-- Login -->
    <div class="login-card" id="loginCard">
        <h2>&#128274; Admin girişi</h2>
        <label>Şifrə</label>
        <input type="password" id="adminPassword" placeholder="Admin şifrəsini daxil edin">
        <button class="btn btn-primary btn-block" onclick="adminLogin()">Daxil ol</button>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="stats" id="statsRow"></div>

        <div class="tabs">
            <button class="tab active" data-tab="teams" onclick="switchTab('teams', this)">Taqımlar</button>
            <button class="tab" data-tab="works" onclick="switchTab('works', this)">Sərbəst işlər</button>
            <button class="tab" data-tab="all-keys" onclick="switchTab('all-keys', this)">Bütün açarlar</button>
        </div>

        <!-- Teams Tab -->
        <div class="tab-content active" id="tab-teams">
            <div class="actions-row">
                <button class="btn btn-primary" onclick="generateAllKeys()">&#128273; Bütün açarları yarat</button>
                <button class="btn print-btn" onclick="window.print()">&#128424; Çap et</button>
                <button class="btn btn-danger" onclick="resetAllData()" style="margin-left:auto;">&#9888; Hamısını sıfırla</button>
            </div>

            <div class="tabs" id="teamTabs"></div>
            <div class="card">
                <div class="table-wrapper">
                    <table id="studentsTable">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Ad, Soyad, Ata adı</th>
                                <th>Açar</th>
                                <th>Status</th>
                                <th>Seçilən işlər</th>
                                <th>Əməliyyat</th>
                            </tr>
                        </thead>
                        <tbody id="studentsBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Works Tab -->
        <div class="tab-content" id="tab-works" style="display:none;">
            <div class="tabs" id="worksTeamTabs"></div>
            <div class="card">
                <div class="card-title">&#128218; Sərbəst işlərin vəziyyəti — <span id="worksTeamLabel"></span></div>
                <div id="worksOverview"></div>
            </div>
        </div>

        <!-- All Keys Tab -->
        <div class="tab-content" id="tab-all-keys" style="display:none;">
            <div class="actions-row">
                <button class="btn btn-primary" onclick="generateAllKeys()">&#128273; Bütün açarları yarat</button>
                <button class="btn print-btn" onclick="window.print()">&#128424; Çap et</button>
            </div>
            <div class="card">
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Taqım</th>
                                <th>Ad, Soyad, Ata adı</th>
                                <th>Açar</th>
                            </tr>
                        </thead>
                        <tbody id="allKeysBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let adminPass = '';
    let teams = {};
    let works = [];
    let selections = {};
    let workTakenBy = {};
    let keys = {};
    let currentTeam = '';

    async function adminLogin() {
        adminPass = document.getElementById('adminPassword').value;
        if (!adminPass) { showToast('Şifrəni daxil edin!', 'error'); return; }

        try {
            // Verify password via status endpoint (requires password)
            const res = await fetch('/api/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPass })
            });
            const data = await res.json();

            if (!res.ok) {
                showToast(data.error || 'Şifrə yanlışdır!', 'error');
                return;
            }

            selections = data.selections;
            workTakenBy = data.work_taken_by;
            keys = data.keys;

            const teamsRes = await fetch('/api/teams').then(r => r.json());
            teams = teamsRes.teams;
            const worksRes = await fetch('/api/works?team=YTF24A1').then(r => r.json());
            works = worksRes.works;

            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('dashboard').classList.add('active');

            renderStats();
            renderTeamTabs();
            renderWorksOverview();
            renderAllKeys();

        } catch(e) {
            showToast('Xəta: Server ilə əlaqə yoxdur', 'error');
        }
    }

    function renderStats() {
        const totalStudents = Object.values(teams).flat().length;
        const totalSelected = Object.keys(selections).length;
        const totalKeyAssigned = Object.keys(keys).length;

        // Calculate per-team taken works from selections data
        let teamWorkCounts = {};
        for (const t of Object.keys(teams)) { teamWorkCounts[t] = 0; }
        for (const [student, workIds] of Object.entries(selections)) {
            for (const [teamName, members] of Object.entries(teams)) {
                if (members.includes(student)) {
                    teamWorkCounts[teamName] += workIds.length;
                    break;
                }
            }
        }
        const totalWorksTaken = Object.values(teamWorkCounts).reduce((a, b) => a + b, 0);

        let teamStatsHtml = '';
        for (const [teamName, count] of Object.entries(teamWorkCounts)) {
            teamStatsHtml += `<div class="stat-card"><div class="value">${count}/50</div><div class="label">${teamName}</div></div>`;
        }

        document.getElementById('statsRow').innerHTML = `
            <div class="stat-card"><div class="value">${totalStudents}</div><div class="label">Ümumi kursant</div></div>
            <div class="stat-card"><div class="value">${totalKeyAssigned}</div><div class="label">Açar verilən</div></div>
            <div class="stat-card"><div class="value">${totalSelected}</div><div class="label">Seçim edən</div></div>
            <div class="stat-card"><div class="value">${totalWorksTaken}</div><div class="label">Ümumi tutulmuş iş</div></div>
            ${teamStatsHtml}
        `;
    }

    function renderTeamTabs() {
        const container = document.getElementById('teamTabs');
        container.innerHTML = '';
        const teamNames = Object.keys(teams);
        currentTeam = teamNames[0];

        teamNames.forEach((name, i) => {
            const btn = document.createElement('button');
            btn.className = 'tab' + (i === 0 ? ' active' : '');
            btn.textContent = name;
            btn.onclick = () => {
                currentTeam = name;
                container.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                btn.classList.add('active');
                renderStudentsTable();
            };
            container.appendChild(btn);
        });

        renderStudentsTable();
    }

    function renderStudentsTable() {
        const body = document.getElementById('studentsBody');
        body.innerHTML = '';
        const members = teams[currentTeam] || [];

        members.forEach((name, i) => {
            const key = keys[name] || '';
            const sel = selections[name] || [];
            let status, statusClass;

            if (sel.length >= 2) {
                status = 'Tamamlanıb';
                statusClass = 'done';
            } else if (key) {
                status = 'Gözləyir';
                statusClass = 'pending';
            } else {
                status = 'Açar yoxdur';
                statusClass = 'nokey';
            }

            const workTitles = sel.map(id => works[id] ? `${parseInt(id)+1}. ${works[id].title}` : `#${id}`).join('<br>');

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${i + 1}</td>
                <td>${name}</td>
                <td>${key ? `<span class="key-badge">${key}</span>` : '—'}</td>
                <td><span class="status-badge ${statusClass}">${status}</span></td>
                <td style="font-size:0.8rem;max-width:300px;">${workTitles || '—'}</td>
                <td>
                    ${sel.length > 0 ? `<button class="btn btn-danger btn-sm" onclick="resetStudent('${name.replace(/'/g, "\\'")}')">Sıfırla</button>` : ''}
                </td>
            `;
            body.appendChild(tr);
        });
    }

    let worksCurrentTeam = '';

    function renderWorksOverview() {
        // Render team tabs for works
        const tabsContainer = document.getElementById('worksTeamTabs');
        if (!tabsContainer.children.length) {
            const teamNames = Object.keys(teams);
            worksCurrentTeam = teamNames[0];
            teamNames.forEach((name, i) => {
                const btn = document.createElement('button');
                btn.className = 'tab' + (i === 0 ? ' active' : '');
                btn.textContent = name;
                btn.onclick = () => {
                    worksCurrentTeam = name;
                    tabsContainer.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                    btn.classList.add('active');
                    loadWorksForTeam(name);
                };
                tabsContainer.appendChild(btn);
            });
        }
        loadWorksForTeam(worksCurrentTeam);
    }

    async function loadWorksForTeam(team) {
        document.getElementById('worksTeamLabel').textContent = team;
        try {
            const res = await fetch(`/api/works?team=${encodeURIComponent(team)}`).then(r => r.json());
            const container = document.getElementById('worksOverview');
            container.innerHTML = '';
            res.works.forEach(w => {
                const div = document.createElement('div');
                div.className = 'work-row' + (w.taken ? ' taken' : '');
                div.innerHTML = `
                    <div class="num">${w.id + 1}</div>
                    <div class="title">${w.title}</div>
                    <div class="taker">${w.taken_by || ''}</div>
                `;
                container.appendChild(div);
            });
        } catch(e) {}
    }

    function renderAllKeys() {
        const body = document.getElementById('allKeysBody');
        body.innerHTML = '';
        let num = 1;

        for (const [team, members] of Object.entries(teams)) {
            members.forEach(name => {
                const key = keys[name] || '';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${num++}</td>
                    <td><strong>${team}</strong></td>
                    <td>${name}</td>
                    <td>${key ? `<span class="key-badge">${key}</span>` : '—'}</td>
                `;
                body.appendChild(tr);
            });
        }
    }

    async function generateAllKeys() {
        if (!confirm('Açarı olmayan bütün kursantlar üçün yeni açar yaradılacaq. Davam etmək istəyirsiniz?')) return;

        try {
            const res = await fetch('/api/admin/generate-keys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPass })
            });
            const data = await res.json();
            if (!res.ok) { showToast(data.error, 'error'); return; }

            keys = data.keys;
            renderStudentsTable();
            renderStats();
            renderAllKeys();
            showToast('Açarlar uğurla yaradıldı!', 'success');
        } catch(e) {
            showToast('Xəta baş verdi', 'error');
        }
    }

    async function resetStudent(name) {
        if (!confirm(`"${name}" üçün seçimi sıfırlamaq istəyirsiniz?`)) return;

        try {
            const res = await fetch('/api/admin/reset-selection', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPass, name })
            });
            const data = await res.json();
            if (!res.ok) { showToast(data.error, 'error'); return; }

            // Refresh
            await refreshData();
            showToast('Seçim sıfırlandı!', 'success');
        } catch(e) {
            showToast('Xəta baş verdi', 'error');
        }
    }

    async function resetAllData() {
        if (!confirm('DİQQƏT! Bütün açarlar və seçimlər silinəcək. Davam etmək istəyirsiniz?')) return;
        if (!confirm('Bu əməliyyat geri qaytarıla bilməz. Mütləq əminsiniz?')) return;

        try {
            const res = await fetch('/api/admin/reset-all', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPass })
            });
            const data = await res.json();
            if (!res.ok) { showToast(data.error, 'error'); return; }

            await refreshData();
            showToast('Bütün məlumatlar sıfırlandı!', 'success');
        } catch(e) {
            showToast('Xəta baş verdi', 'error');
        }
    }

    async function refreshData() {
        const [statusRes, worksRes] = await Promise.all([
            fetch('/api/status', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: adminPass })
            }).then(r => r.json()),
            fetch('/api/works?team=YTF24A1').then(r => r.json())
        ]);
        selections = statusRes.selections;
        workTakenBy = statusRes.work_taken_by;
        keys = statusRes.keys;
        works = worksRes.works;

        renderStats();
        renderStudentsTable();
        renderWorksOverview();
        renderAllKeys();
    }

    function switchTab(name, btn) {
        document.querySelectorAll('.tab-content').forEach(tc => tc.style.display = 'none');
        document.getElementById('tab-' + name).style.display = 'block';
        btn.parentElement.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
    }

    function showToast(msg, type) {
        document.querySelectorAll('.toast').forEach(t => t.remove());
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3500);
    }

    // Enter key for login
    document.getElementById('adminPassword').addEventListener('keydown', e => {
        if (e.key === 'Enter') adminLogin();
    });
</script>

</body>
</html>
