<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ədəbiyyat — Mühəndis Texnikası Təminatı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 24px 20px 16px;
            background: rgba(15,23,42,0.95);
            border-bottom: 1px solid rgba(212,168,83,0.2);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(20px);
        }
        .header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f0c75e, #d4a853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .header p { color: #94a3b8; font-size: 0.85rem; }
        .nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
        }
        .nav button {
            padding: 8px 20px;
            border-radius: 8px;
            border: 1px solid rgba(212,168,83,0.3);
            background: rgba(15,23,42,0.8);
            color: #d4a853;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .nav button:hover { background: rgba(212,168,83,0.1); }
        .nav .page-info {
            font-size: 0.9rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav .page-input {
            width: 65px;
            padding: 6px 8px;
            border-radius: 6px;
            border: 1px solid rgba(212,168,83,0.3);
            background: rgba(15,23,42,0.8);
            color: #d4a853;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
        }
        .nav .page-input:focus { border-color: #d4a853; }
        .nav .page-input::-webkit-outer-spin-button,
        .nav .page-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .back-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid rgba(212,168,83,0.2);
            background: transparent;
            color: #94a3b8;
            font-family: inherit;
            font-size: 0.8rem;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .back-btn:hover { color: #d4a853; border-color: rgba(212,168,83,0.4); }

        @media (max-width: 768px) {
            .back-btn {
                position: static;
                transform: none;
                align-self: center;
                margin-bottom: 4px;
            }
            .header { padding: 10px 12px 10px; display: flex; flex-direction: column; align-items: center; }
            .header h1 { font-size: 1.1rem; }
            .nav { gap: 8px; }
            .nav button { padding: 8px 14px; font-size: 0.8rem; }
            .nav .page-info { font-size: 0.8rem; flex-direction: row; white-space: nowrap; }
        }
        .page-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .page-img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(212,168,83,0.1);
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
            -webkit-touch-callout: none;
        }
        .page-container {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="header" style="position:relative;">
        <a href="/" class="back-btn">&#8592; Geri</a>
        <h1>Mühəndis Texnikası Təminatı</h1>
        <p>İstifadə ediləcək ədəbiyyat</p>
        <div class="nav">
            <button onclick="prevPage()">&#8592; Əvvəlki</button>
            <div class="page-info">Səhifə&nbsp;<input type="number" class="page-input" id="pageInput" value="1" min="1" max="224" onchange="goToPage(this.value)" onkeydown="if(event.key==='Enter')goToPage(this.value)">&nbsp;/&nbsp;224</div>
            <button onclick="nextPage()">Növbəti &#8594;</button>
        </div>
    </div>
    <div class="page-container">
        <img class="page-img" id="pageImg" src="kitab/1.jpg" alt="Səhifə 1">
    </div>

<script>
    const total = 224;
    let current = 1;

    function show(n) {
        current = n;
        document.getElementById('pageImg').src = `kitab/${n}.jpg`;
        document.getElementById('pageInput').value = n;
    }

    function goToPage(val) {
        let n = parseInt(val);
        if (isNaN(n) || n < 1) n = 1;
        if (n > total) n = total;
        show(n);
    }

    function prevPage() { if (current > 1) show(current - 1); }
    function nextPage() { if (current < total) show(current + 1); }

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') prevPage();
        if (e.key === 'ArrowRight') nextPage();
    });

    // Swipe support
    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
    document.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (diff > 50) nextPage();
        if (diff < -50) prevPage();
    });

    // Block: right click, drag, copy, print screen, save
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        // Block Ctrl+S, Ctrl+P, Ctrl+Shift+S, PrintScreen
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'S' || e.key === 'P')) {
            e.preventDefault();
        }
        if (e.key === 'PrintScreen') {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
