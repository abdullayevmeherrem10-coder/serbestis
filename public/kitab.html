<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ədəbiyyat — Mühəndis Texnikası Təminatı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e5edea 50%, #eef2f0 100%);
            color: #1a1a2e;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 24px 20px 16px;
            background: rgba(255,255,255,0.95);
            border-bottom: 1.5px solid rgba(200,230,201,0.6);
            box-shadow: 0 4px 20px rgba(69,95,81,0.08);
            position: sticky;
            top: 0;
            z-index: 10;
            backdrop-filter: blur(20px);
        }
        .header h1 {
            font-size: 1.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #455f51, #2e4a3e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .header p { color: #55635c; font-size: 0.85rem; }
        .nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 12px;
        }
        .nav button {
            padding: 8px 20px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #455f51, #6b8f7b);
            color: #fff;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(69,95,81,0.25);
            transition: all 0.3s;
        }
        .nav button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(69,95,81,0.35); }
        .nav .page-info {
            font-size: 0.9rem;
            color: #55635c;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav .page-input {
            width: 65px;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1.5px solid #d5e8d4;
            background: #ffffff;
            color: #455f51;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 700;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
            transition: all 0.3s;
        }
        .nav .page-input:focus { border-color: #455f51; box-shadow: 0 0 0 3px rgba(69,95,81,0.1); }
        .nav .page-input::-webkit-outer-spin-button,
        .nav .page-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .back-btn {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1.5px solid rgba(69,95,81,0.25);
            background: rgba(255,255,255,0.8);
            color: #455f51;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        .back-btn:hover { color: #2e4a3e; border-color: rgba(69,95,81,0.5); background: rgba(69,95,81,0.06); }

        @media (max-width: 768px) {
            .back-btn {
                position: static;
                transform: none;
                align-self: center;
                margin-bottom: 4px;
            }
            .header { padding: 10px 12px 10px; display: flex; flex-direction: column; align-items: center; }
            .header h1 { font-size: 1.1rem; }
            .nav { gap: 8px; }
            .nav button { padding: 8px 14px; font-size: 0.8rem; }
            .nav .page-info { font-size: 0.8rem; flex-direction: row; white-space: nowrap; }
        }
        .page-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 20px;
        }
        .page-img {
            width: 100%;
            border-radius: 12px;
            box-shadow: 8px 8px 0 rgba(143,166,155,0.38), 0 10px 30px rgba(69,95,81,0.12);
            border: 1.5px solid rgba(200,230,201,0.6);
            -webkit-user-select: none;
            user-select: none;
            pointer-events: none;
            -webkit-touch-callout: none;
        }
        .page-container {
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <div class="header" style="position:relative;">
        <a href="/" class="back-btn">&#8592; Geri</a>
        <h1>Mühəndis Texnikası Təminatı</h1>
        <p>İstifadə ediləcək ədəbiyyat</p>
        <div class="nav">
            <button onclick="prevPage()">&#8592; Əvvəlki</button>
            <div class="page-info">Səhifə&nbsp;<input type="number" class="page-input" id="pageInput" value="1" min="1" max="224" onchange="goToPage(this.value)" onkeydown="if(event.key==='Enter')goToPage(this.value)"><span id="pageLabel" style="display:none;color:#455f51;font-weight:700;font-size:0.9rem;"></span>&nbsp;/&nbsp;224</div>
            <button onclick="nextPage()">Növbəti &#8594;</button>
        </div>
    </div>
    <div class="page-container">
        <img class="page-img" id="pageImg" src="kitab/1.jpg" alt="Səhifə 1">
    </div>

<script>
    // Page mapping: 1,2 = kitab, then 4 mundericat, then kitab 3-224
    // Display pages: 1,2, M1,M2,M3,M4, 3,4,...224
    // Total display pages: 224 + 4 = 228
    const totalDisplay = 228;
    let current = 1;

    function getPageFile(n) {
        if (n <= 2) return `kitab/${n}.jpg`;
        if (n === 3) return 'kitab/m1.jpg';
        if (n === 4) return 'kitab/m2.jpg';
        if (n === 5) return 'kitab/m3.jpg';
        if (n === 6) return 'kitab/m4.jpg';
        return `kitab/${n - 4}.jpg`;
    }

    function getPageLabel(n) {
        if (n <= 2) return n;
        if (n >= 3 && n <= 6) return 'Mündəricat';
        return n - 4;
    }

    function show(n) {
        current = n;
        document.getElementById('pageImg').src = getPageFile(n);
        const label = getPageLabel(n);
        document.getElementById('pageInput').value = typeof label === 'number' ? label : '';
        document.getElementById('pageLabel').textContent = typeof label === 'string' ? label : '';
        document.getElementById('pageInput').style.display = typeof label === 'number' ? '' : 'none';
        document.getElementById('pageLabel').style.display = typeof label === 'string' ? 'inline' : 'none';
    }

    function goToPage(val) {
        let n = parseInt(val);
        if (isNaN(n) || n < 1) n = 1;
        if (n > 224) n = 224;
        // Convert book page to display page
        if (n <= 2) { show(n); return; }
        show(n + 4);
    }

    function prevPage() { if (current > 1) show(current - 1); }
    function nextPage() { if (current < totalDisplay) show(current + 1); }

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft') prevPage();
        if (e.key === 'ArrowRight') nextPage();
    });

    // Swipe support
    let touchStartX = 0;
    document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
    document.addEventListener('touchend', e => {
        const diff = touchStartX - e.changedTouches[0].clientX;
        if (diff > 50) nextPage();
        if (diff < -50) prevPage();
    });

    // Block: right click, drag, copy, print screen, save
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dragstart', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());

    // Hide content when page loses focus (Alt+Tab, Win+Shift+S, etc.)
    const pageImg = document.getElementById('pageImg');
    const overlay = document.createElement('div');
    overlay.id = 'ssOverlay';
    overlay.style.cssText = 'display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#455f51;z-index:9999;align-items:center;justify-content:center;color:#fff;font-size:1.2rem;font-family:Inter,sans-serif;font-weight:700;';
    overlay.textContent = 'Ekran görüntüsü almaq qadağandır!';
    document.body.appendChild(overlay);

    function hideContent() {
        overlay.style.display = 'flex';
        pageImg.style.visibility = 'hidden';
    }
    function showContent() {
        overlay.style.display = 'none';
        pageImg.style.visibility = 'visible';
    }

    document.addEventListener('visibilitychange', () => {
        if (document.hidden) hideContent(); else setTimeout(showContent, 300);
    });
    window.addEventListener('blur', () => hideContent());
    window.addEventListener('focus', () => setTimeout(showContent, 300));

    document.addEventListener('keydown', e => {
        // Block Ctrl+S, Ctrl+P, Ctrl+Shift+S, PrintScreen
        if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'S' || e.key === 'P')) {
            e.preventDefault();
        }
        if (e.key === 'PrintScreen') {
            e.preventDefault();
            hideContent();
            setTimeout(showContent, 1500);
        }
        // Win+Shift+S detection (key combo triggers blur)
    });
</script>
</body>
</html>
